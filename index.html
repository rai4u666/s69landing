<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>S69 GAMES — Coming Soon</title>
  <meta name="description" content="Your best expedition coming soon. Add us to your wishlist on Steam.">

  <!-- Закрыто от индексации -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow">
  <meta name="yandex" content="noindex, nofollow">

  <meta name="theme-color" content="#0c0a2e">
  <meta property="og:title" content="S69 GAMES">
  <meta property="og:description" content="Your best expedition coming soon.">
  <meta property="og:image" content="/assets/og.jpg">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <link rel="preload" as="image" href="/assets/bg-islands.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --night: #0c0a2e;
      --violet: #9b7bff;
      --cyan: #62f0e6;
      --gold: #f6cf6a;
      --gold-deep: #d99a2b;
      --text: #f4f1ff;
      --muted: rgba(228, 222, 255, .78);
      --mx: 0;
      --my: 0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--night);
      color: var(--text);
      font-family: "Rajdhani", system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      isolation: isolate;
    }

    /* ---------- Фон ---------- */
    .bg {
      position: absolute;
      inset: -4%;
      background: url("/assets/bg-islands.webp") center 40% / cover no-repeat;
      transform: translate3d(calc(var(--mx) * -14px), calc(var(--my) * -10px), 0) scale(1.04);
      animation: breathe 28s ease-in-out infinite alternate;
      z-index: -4;
      will-change: transform;
    }
    @keyframes breathe {
      from { filter: saturate(1.05) brightness(.92); }
      to   { filter: saturate(1.2)  brightness(1); }
    }
    .shade {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(ellipse 46% 42% at 50% 46%, rgba(12,10,46,.72) 0%, rgba(12,10,46,.35) 55%, rgba(12,10,46,0) 100%),
        linear-gradient(180deg, rgba(12,10,46,.35) 0%, rgba(12,10,46,0) 30%, rgba(12,10,46,0) 55%, rgba(12,10,46,.92) 100%),
        radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(6,4,24,.75) 100%);
    }
    #stars {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
    }

    /* ---------- Персонажи ---------- */
    .hero {
      position: absolute;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      user-select: none;
      -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
              mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
      opacity: 0;
      will-change: transform;
    }
    .hero img { display: block; height: 100%; width: auto; }
    .knight {
      left: -20vw;
      height: min(82vh, 880px);
      transform: translate3d(calc(var(--mx) * 18px), calc(var(--my) * 8px), 0);
      animation: rise-left 1.4s .25s cubic-bezier(.2,.8,.2,1) forwards;
      filter: drop-shadow(0 0 40px rgba(246,207,106,.22));
    }
    .medic {
      right: -3vw;
      height: min(84vh, 900px);
      transform: translate3d(calc(var(--mx) * 26px), calc(var(--my) * 10px), 0);
      animation: rise-right 1.4s .45s cubic-bezier(.2,.8,.2,1) forwards;
      filter: drop-shadow(0 0 40px rgba(98,240,230,.22));
    }
    .knight img { animation: float 7s ease-in-out infinite; }
    .medic img  { animation: float 8s 1.2s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-10px); }
    }
    @keyframes rise-left  { from { opacity: 0; translate: -60px 40px; } to { opacity: 1; translate: 0 0; } }
    @keyframes rise-right { from { opacity: 0; translate:  60px 40px; } to { opacity: 1; translate: 0 0; } }

    /* ---------- Контент ---------- */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px 6vh;
      transform: translate3d(calc(var(--mx) * -6px), calc(var(--my) * -4px), 0);
    }

    .brand {
      font-family: "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(52px, 8.6vw, 150px);
      line-height: .9;
      letter-spacing: .04em;
      background: linear-gradient(180deg, #fffaf0 0%, #ffe7a8 38%, var(--gold) 58%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 rgba(60,30,120,.55)) drop-shadow(0 0 36px rgba(155,123,255,.55));
      opacity: 0;
      animation: reveal 1.2s .1s cubic-bezier(.2,.8,.2,1) forwards;
      position: relative;
    }
    .brand .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.85) 50%, transparent 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      animation: shine 6s 1.6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shine {
      0%   { background-position: 150% 0; }
      35%, 100% { background-position: -50% 0; }
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: clamp(18px, 3vh, 30px) 0 clamp(12px, 2vh, 20px);
      opacity: 0;
      animation: reveal 1s .5s ease forwards;
    }
    .divider span {
      display: block;
      width: clamp(40px, 9vw, 120px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan));
    }
    .divider span:last-child { background: linear-gradient(270deg, transparent, var(--cyan)); }
    .divider svg { width: 18px; height: 18px; filter: drop-shadow(0 0 8px var(--cyan)); }

    .tagline {
      font-weight: 700;
      font-size: clamp(18px, 2.3vw, 30px);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 18px rgba(12,10,46,.9);
      padding-left: .32em; /* компенсирует letter-spacing для центровки */
      opacity: 0;
      animation: reveal 1s .65s ease forwards;
    }
    .tagline em {
      display: block;
      font-style: normal;
      margin-top: .35em;
      font-size: .82em;
      letter-spacing: .5em;
      padding-left: .5em;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(98,240,230,.6);
    }

    .cta {
      margin-top: clamp(28px, 5vh, 48px);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 18px 34px 18px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(15px, 1.35vw, 18px);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #1b1233;
      background: linear-gradient(180deg, #ffeeb8 0%, var(--gold) 45%, var(--gold-deep) 100%);
      box-shadow:
        0 0 0 1px rgba(255,240,200,.6) inset,
        0 -3px 0 rgba(120,70,10,.35) inset,
        0 10px 30px rgba(217,154,43,.35),
        0 0 60px rgba(155,123,255,.35);
      position: relative;
      overflow: hidden;
      transition: transform .25s ease, box-shadow .25s ease;
      opacity: 0;
      animation: reveal 1s .85s ease forwards;
    }
    .cta::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.7), transparent);
      transform: skewX(-20deg);
      animation: sweep 4.5s 2.2s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { left: -60%; }
      30%, 100% { left: 130%; }
    }
    .cta:hover, .cta:focus-visible {
      transform: translateY(-3px);
      box-shadow:
        0 0 0 1px rgba(255,240,200,.8) inset,
        0 -3px 0 rgba(120,70,10,.35) inset,
        0 16px 40px rgba(217,154,43,.5),
        0 0 80px rgba(155,123,255,.55);
      outline: none;
    }
    .cta svg { width: 26px; height: 26px; flex: none; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }
    /* у .brand свой drop-shadow фильтр — не затирать его после анимации */
    .brand { animation-name: reveal-brand; }
    @keyframes reveal-brand {
      from { opacity: 0; transform: translateY(18px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .foot {
      position: absolute;
      left: 0; right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 13px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: .7;
    }

    /* ---------- Адаптив ---------- */
    @media (max-width: 1100px) {
      .content { justify-content: flex-start; padding-top: 12vh; }
      .brand { font-size: clamp(52px, 12vw, 120px); }
      .knight { height: 58vh; left: -16vw; }
      .medic  { height: 56vh; right: -8vw; }
    }
    @media (max-width: 720px) {
      .content { justify-content: flex-start; padding-top: 14vh; }
      .knight { height: 54vh; left: -30vw; }
      .medic  { height: 50vh; right: -22vw; }
      .tagline { letter-spacing: .22em; padding-left: .22em; }
      .tagline em { letter-spacing: .36em; padding-left: .36em; }
      .cta { padding: 15px 20px 15px 18px; gap: 10px; letter-spacing: .06em; font-size: 14px; white-space: nowrap; }
      .cta svg { width: 20px; height: 20px; }
      .shade {
        background:
          linear-gradient(180deg, rgba(12,10,46,.55) 0%, rgba(12,10,46,.15) 45%, rgba(12,10,46,.35) 70%, rgba(12,10,46,.95) 100%);
      }
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
      .bg, .hero, .content { transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="bg" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <div class="hero knight" aria-hidden="true"><img src="/assets/knight.webp" alt="" width="1402" height="1122"></div>
    <div class="hero medic"  aria-hidden="true"><img src="/assets/medic.webp"  alt="" width="1024" height="1536"></div>

    <section class="content">
      <h1 class="brand">S69 GAMES<span class="shine" aria-hidden="true">S69 GAMES</span></h1>

      <div class="divider" aria-hidden="true">
        <span></span>
        <svg viewBox="0 0 24 24"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="#62f0e6"/></svg>
        <span></span>
      </div>

      <p class="tagline">Your best expedition <em>coming soon</em></p>

      <!-- TODO: заменить на ссылку страницы игры в Steam -->
      <a class="cta" href="https://store.steampowered.com/" target="_blank" rel="noopener nofollow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>
        </svg>
        Add us to wishlist on Steam
      </a>
    </section>

    <div class="foot">© <span id="y">2026</span> S69 Games</div>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Параллакс от мыши / наклона
    if (!reduce) {
      const root = document.documentElement;
      let tx = 0, ty = 0, cx = 0, cy = 0;
      addEventListener('pointermove', e => {
        tx = (e.clientX / innerWidth - .5) * 2;
        ty = (e.clientY / innerHeight - .5) * 2;
      }, { passive: true });
      (function loop() {
        cx += (tx - cx) * .06; cy += (ty - cy) * .06;
        root.style.setProperty('--mx', cx.toFixed(3));
        root.style.setProperty('--my', cy.toFixed(3));
        requestAnimationFrame(loop);
      })();
    }

    // Мерцающие звёзды и искры
    const cv = document.getElementById('stars');
    const ctx = cv.getContext('2d');
    let W, H, dpr, stars = [];
    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = cv.width = innerWidth * dpr;
      H = cv.height = innerHeight * dpr;
      cv.style.width = innerWidth + 'px';
      cv.style.height = innerHeight + 'px';
      const n = Math.round(innerWidth * innerHeight / 9000);
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.4 + .3) * dpr,
        p: Math.random() * Math.PI * 2,
        s: Math.random() * .02 + .005,
        v: (Math.random() * .25 + .05) * dpr,
        c: Math.random() < .2 ? '98,240,230' : Math.random() < .35 ? '246,207,106' : '230,225,255'
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        s.p += s.s;
        if (!reduce) { s.y -= s.v; if (s.y < -5) { s.y = H + 5; s.x = Math.random() * W; } }
        const a = .25 + .75 * Math.abs(Math.sin(s.p));
        ctx.beginPath();
        ctx.fillStyle = `rgba(${s.c},${a})`;
        ctx.shadowColor = `rgba(${s.c},${a})`;
        ctx.shadowBlur = 6 * dpr;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    addEventListener('resize', resize);
    resize(); draw();
  </script>
</body>
</html>
